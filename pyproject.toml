[project]
name = "pdf-encryptor"
version = "0.1.0"
description = "PDF 图片化加密小工具：转图防编辑 + 随机密码加密"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
pdf-encryptor = "pdf_encryptor:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
